
name: Build Anis UNSS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare project
        run: |
          set -e

          if [ ! -f capacitor.config.json ]; then
            echo "ERROR: capacitor.config.json missing"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html missing"
            exit 1
          fi

          if [ ! -f package.json ]; then
            cat > package.json <<'EOF'
          {
            "name": "anis-unss",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Web assets ready"
            },
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/android": "^6.2.0",
              "@capacitor/local-notifications": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          EOF
          fi

          echo "Project files checked"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install native Adhan
        run: |
          chmod +x native/android/install-native.sh
          bash native/android/install-native.sh

      - name: Copy icons and sounds
        run: |
          set -e

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            if compgen -G "resources/mipmap-$d/*.png" > /dev/null; then
              cp resources/mipmap-$d/*.png \
                "android/app/src/main/res/mipmap-$d/"
            fi
          done

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi nodpi; do
            mkdir -p "android/app/src/main/res/drawable-$d"
            if compgen -G "resources/drawable-$d/*.png" > /dev/null; then
              cp resources/drawable-$d/*.png \
                "android/app/src/main/res/drawable-$d/"
            fi
          done

          mkdir -p android/app/src/main/res/raw

          for f in resources/sounds/*.wav; do
            if [ -f "$f" ]; then
              cp "$f" android/app/src/main/res/raw/
            fi
          done

          cp resources/sounds/adhan.mp3 \
            android/app/src/main/res/raw/adhan.mp3

      - name: Sync Android
        run: npx cap sync android

      - name: Verify native Adhan
        run: |
          set -e
          test -f android/app/src/main/java/com/anis/unss/AdhanFullScreenActivity.java
          test -f android/app/src/main/java/com/anis/unss/AdhanAlarmReceiver.java
          test -f android/app/src/main/java/com/anis/unss/AdhanBootReceiver.java
          test -f android/app/src/main/java/com/anis/unss/AdhanOverlayPlugin.java
          grep -q "USE_FULL_SCREEN_INTENT" android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anis-UNSS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
